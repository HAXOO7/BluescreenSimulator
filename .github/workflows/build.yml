name: Build BluescreenSimulator

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install .NET Framework 4.5.2 Reference Assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 `
            -Version 1.0.3 `
            -OutputDirectory packages `
            -NonInteractive

          $referencePath = Get-ChildItem `
            "packages/Microsoft.NETFramework.ReferenceAssemblies.net452.1.0.3" `
            -Recurse -Directory |
            Where-Object { $_.Name -eq "v4.5.2" } |
            Select-Object -First 1

          if (-not $referencePath) {
            throw ".NET Framework 4.5.2 reference assemblies not found."
          }

          Write-Host "Reference assemblies: $($referencePath.FullName)"

      - name: Restore NuGet Packages
        shell: pwsh
        run: |
          nuget restore BluescreenSimulator.sln

      - name: Build Release
        shell: pwsh
        run: |
          msbuild BluescreenSimulator.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:RestorePackages=false `
            /p:FrameworkPathOverride="$((Resolve-Path 'packages/Microsoft.NETFramework.ReferenceAssemblies.net452.1.0.3/build/.NETFramework/v4.5.2').Path)" `
            /verbosity:minimal

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "BluescreenSimulator.exe" -Recurse |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Build failed: BluescreenSimulator.exe not found."
          }

          Write-Host "Build successful!"
          Get-Item $exe.FullName | Format-List Name, Length, FullName

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: BluescreenSimulator-3.4.0-Windows
          path: |
            **/bin/Release/**
          if-no-files-found: error
          retention-days: 30
