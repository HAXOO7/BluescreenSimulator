name: Build BluescreenSimulator

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install .NET Framework 4.5.2 Reference Assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 `
            -Version 1.0.3 `
            -OutputDirectory packages `
            -NonInteractive

          $referencePath = Get-ChildItem `
            "packages/Microsoft.NETFramework.ReferenceAssemblies.net452.1.0.3" `
            -Recurse -Directory |
            Where-Object { $_.Name -eq "v4.5.2" } |
            Select-Object -First 1

          if (-not $referencePath) {
            throw ".NET Framework 4.5.2 reference assemblies not found."
          }

          Write-Host "Reference assemblies: $($referencePath.FullName)"
          "FrameworkPathOverride=$($referencePath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore NuGet Packages
        shell: pwsh
        run: |
          nuget restore BluescreenSimulator.sln

      - name: Build Release
        shell: pwsh
        run: |
          msbuild BluescreenSimulator.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:RestorePackages=false `
            /p:FrameworkPathOverride="$env:FrameworkPathOverride" `
            /verbosity:minimal

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "BluescreenSimulator.exe" -Recurse |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Build failed: BluescreenSimulator.exe not found."
          }

          Write-Host "Build successful!"
          Get-Item $exe.FullName | Format-List Name, Length, FullName

      - name: Prepare portable package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "BluescreenSimulator.exe" -Recurse |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "Executable missing." }
          $package = Join-Path $env:RUNNER_TEMP "BluescreenSimulator-Windows11-Edition"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -Path (Join-Path $exe.Directory.FullName '*') -Destination $package -Recurse -Force
          @"
          BluescreenSimulator - Windows 11 Black Screen edition

          Run BluescreenSimulator.exe. Keep all files in this folder together.
          Windows 11 24H2+ black stop-error simulation is available as a separate tab.
          F7 exits the new Windows 11 simulation (Escape is intentionally disabled).
          This is a normal WPF window simulation; it does not trigger a system bugcheck.
          "@ | Set-Content (Join-Path $package "README-Windows11.txt") -Encoding UTF8
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $env:RUNNER_TEMP "BluescreenSimulator-Windows11-Edition.zip") -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: BluescreenSimulator-Windows11-Edition
          path: ${{ runner.temp }}/BluescreenSimulator-Windows11-Edition.zip
          if-no-files-found: error
          retention-days: 30
